## @section kube-prometheus-stack parameters
## Optional bundled Prometheus stack. Disabled by default. Enable when you do not already have
## a Prometheus Operator installed in the cluster.
##
## IMPORTANT — namespace:
##   Everything is installed into .Release.Namespace (not a dedicated "monitoring" namespace).
##   When enabled, update CRUISEKUBE_DEPENDENCIES_INCLUSTER_PROMETHEUSURL if you are overriding
##   it manually; otherwise the chart computes the correct in-cluster URL automatically.
##
## IMPORTANT — running a SECOND operator on purpose (separate config control):
##   You CAN keep prometheusOperator.enabled=true and run a dedicated operator for CruiseKube — but only
##   if the two operators OWN disjoint namespaces. "Ownership" here means managing Prometheus/Alertmanager
##   instances (StatefulSets), not reading ServiceMonitors (which is safe to share). To do this:
##     1. Scope THIS operator to only own instances in its own namespace via
##        prometheusOperator.prometheusInstanceNamespaces (see below). Leave ServiceMonitor discovery broad
##        so it still scrapes exporters elsewhere.
##     2. Scope the EXISTING (production) operator to STOP owning this namespace — add this release's
##        namespace to its prometheusOperator.denyNamespaces (or set its prometheusInstanceNamespaces to an
##        explicit list that excludes it). This edit to the existing release is unavoidable while it is
##        cluster-wide. See docs/install/gs-prerequisites.md ("Option B2").
##   Because CRDs and admission webhooks are cluster-scoped, also keep crds.enabled=false (reuse the shared
##   CRDs) and set prometheusOperator.admissionWebhooks.enabled=false / kubeletService.enabled=false on this
##   operator so it does not fight the existing one over cluster-scoped objects.
##
## IMPORTANT — node-exporter (one per node) vs kube-state-metrics (safe to duplicate):
##   node-exporter uses hostNetwork and binds port 9100 on each node. A second DaemonSet cannot
##   schedule ("didn't have free ports"). When another stack already runs it (e.g. monitoring), set
##   nodeExporter.enabled=false so the bundled Prometheus scrapes the existing one.
##   kube-state-metrics is a plain Deployment (no hostNetwork/hostPort), so a second copy coexists
##   fine — disabling it is OPTIONAL (only avoids a duplicate). See docs/install/gs-prerequisites.md.
##
## IMPORTANT — Prometheus storage:
##   This chart sets a persistent storageSpec + retention by default (see prometheus.prometheusSpec below)
##   because CruiseKube needs metric history. It uses the cluster's default StorageClass; set
##   storageClassName explicitly if there is no default, or set storageSpec: null to run ephemeral.
##
## IMPORTANT — ServiceMonitor discovery:
##   The bundled Prometheus uses an empty serviceMonitorSelector so it discovers ServiceMonitors
##   cluster-wide (this chart's monitors, plus existing node-exporter/kube-state-metrics elsewhere).
##   CruiseKube ServiceMonitors still carry release: prometheus for compatibility with external Prometheus.

# NOTE: keys under kube-prometheus-stack are passed through to the kube-prometheus-stack subchart.

kube-prometheus-stack:
  ## @param kube-prometheus-stack.enabled Deploy the bundled kube-prometheus-stack (Prometheus Operator + Prometheus + kube-state-metrics + node-exporter). Off by default.
  enabled: false

  crds:
    ## @param kube-prometheus-stack.crds.enabled Install/upgrade Prometheus Operator CRDs as part of this chart. Set to false if compatible CRDs are already present.
    enabled: true

  ## @param kube-prometheus-stack.prometheusOperator.enabled Deploy the Prometheus Operator. Set false when a cluster-wide operator already exists, so the existing operator reconciles this chart's Prometheus CR (avoids two operators fighting over the same StatefulSets).
  prometheusOperator:
    enabled: true

    ## Scoping for running a DEDICATED second operator (see the "running a SECOND operator" note above).
    ## These are commented out by default (the operator watches/owns cluster-wide). Uncomment when you want
    ## this operator to own ONLY its own Prometheus instance while the existing operator keeps the rest.
    ##
    ## @param kube-prometheus-stack.prometheusOperator.prometheusInstanceNamespaces [array] Namespaces this operator looks in for Prometheus CRs to own. Empty = cluster-wide. Set to the release namespace to avoid fighting an existing operator over instances. ServiceMonitor discovery stays broad.
    # prometheusInstanceNamespaces:
    #   - cruisekube-system
    ## @param kube-prometheus-stack.prometheusOperator.alertmanagerInstanceNamespaces [array] Namespaces this operator owns Alertmanager CRs in. Scope alongside prometheusInstanceNamespaces when running a dedicated operator.
    # alertmanagerInstanceNamespaces:
    #   - cruisekube-system
    ## @param kube-prometheus-stack.prometheusOperator.admissionWebhooks.enabled Install the cluster-scoped PrometheusRule admission webhook. Set false when a second operator already provides it (the webhook is cluster-wide; two are redundant/conflicting).
    admissionWebhooks:
      enabled: true
    ## @param kube-prometheus-stack.prometheusOperator.kubeletService.enabled Have this operator create/maintain the cluster-wide kubelet Service in kube-system. Set false when another operator already manages it, to avoid two operators reconciling the same Service.
    kubeletService:
      enabled: true

  ## Disable unneeded components — CruiseKube only needs Prometheus + its scrapers.
  ## @param kube-prometheus-stack.alertmanager.enabled Disable Alertmanager (not used by CruiseKube).
  alertmanager:
    enabled: false
  ## @param kube-prometheus-stack.grafana.enabled Disable Grafana (not used by CruiseKube).
  grafana:
    enabled: false
  ## @param kube-prometheus-stack.prometheus-windows-exporter.enabled Disable Windows node exporter.
  prometheus-windows-exporter:
    enabled: false
  ## @param kube-prometheus-stack.defaultRules.create Disable default alerting rules (no Alertmanager to receive them).
  defaultRules:
    create: false

  ## @param kube-prometheus-stack.nodeExporter.enabled Deploy node-exporter DaemonSet. Set false when another stack already runs node-exporter (host port 9100 is per-node).
  nodeExporter:
    enabled: true

  ## @param kube-prometheus-stack.kubeStateMetrics.enabled Deploy kube-state-metrics. Safe to leave enabled even when another stack runs it (plain Deployment, no host ports); set false only to avoid a duplicate.
  kubeStateMetrics:
    enabled: true

  ## Prometheus instance configuration.
  prometheus:
    prometheusSpec:
      ## @param kube-prometheus-stack.prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues Set to false so the explicit selector below is honored.
      serviceMonitorSelectorNilUsesHelmValues: false
      ## @param kube-prometheus-stack.prometheus.prometheusSpec.serviceMonitorSelector Empty selector: discover ServiceMonitors in all namespaces (existing exporters + this chart).
      serviceMonitorSelector: {}
      ## @param kube-prometheus-stack.prometheus.prometheusSpec.serviceMonitorNamespaceSelector Match ServiceMonitors in all namespaces.
      serviceMonitorNamespaceSelector: {}

      ## Persistent TSDB by default — CruiseKube needs metric history to produce good recommendations.
      ## Without storage the bundled Prometheus uses an EmptyDir and loses all data on pod restart.
      ## @param kube-prometheus-stack.prometheus.prometheusSpec.retention How long the bundled Prometheus keeps metrics.
      retention: 15d
      ## storageSpec provisions a PVC via the StatefulSet volumeClaimTemplate.
      ## storageClassName is intentionally unset so the cluster's default StorageClass is used; set it
      ## explicitly if there is no default. To run ephemeral (e.g. throwaway tests), set storageSpec: null.
      ## @param kube-prometheus-stack.prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.accessModes [array] Access modes for the Prometheus PVC.
      ## @param kube-prometheus-stack.prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage Size of the Prometheus PVC.
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
