## @section Global parameters
global:
  postgresql:
    auth:
      ## @param global.postgresql.auth.host PostgreSQL hostname
      host: "cruisekube-postgresql"
      ## @param global.postgresql.auth.port PostgreSQL port number
      port: 5432
      ## @param global.postgresql.auth.username PostgreSQL username
      username: "cruisekube"
      ## @param global.postgresql.auth.password PostgreSQL password
      password: "cruisekube"
      ## @param global.postgresql.auth.database PostgreSQL database name
      database: "cruisekube"
## @section CruiseKube Controller parameters

cruisekubeController:
  ## @param cruisekubeController.enabled Enable CruiseKube Controller deployment
  enabled: true
  admin:
    ## @param cruisekubeController.admin.enabled Enable HTTP basic authentication for the controller API and dashboard. When false, the API is unauthenticated, the login page is hidden, and the bootstrap-secrets hook skips admin credential creation. Default: true.
    enabled: true
    ## @param cruisekubeController.admin.existingSecret Name of an existing Secret for HTTP basic auth (username + password). If empty, the chart creates a Secret via a Helm hook Job on install/upgrade (credentials are preserved across upgrades once the Secret exists).
    existingSecret: ""
    ## @param cruisekubeController.admin.userKey Key in the secret for the admin username.
    userKey: admin-user
    ## @param cruisekubeController.admin.passwordKey Key in the secret for the admin password.
    passwordKey: admin-password
    credentialGen:
      image:
        ## @param cruisekubeController.admin.credentialGen.image.repository Image for the hook Job that creates the admin Secret when existingSecret is not set.
        repository: tfy.jfrog.io/tfy-images/bitnami/kubectl
        ## @param cruisekubeController.admin.credentialGen.image.tag Image tag for the credential generator Job.
        tag: "1.28.5"
        ## @param cruisekubeController.admin.credentialGen.image.imagePullPolicy Image pull policy for the credential generator Job.
        imagePullPolicy: IfNotPresent
      resources:
        limits:
          ## @param cruisekubeController.admin.credentialGen.resources.limits.cpu Resource limits (CPU) for the credential generator Job.
          cpu: 200m
          ## @param cruisekubeController.admin.credentialGen.resources.limits.memory Resource limits (memory) for the credential generator Job.
          memory: 128Mi
        requests:
          ## @param cruisekubeController.admin.credentialGen.resources.requests.cpu Resource requests (CPU) for the credential generator Job.
          cpu: 50m
          ## @param cruisekubeController.admin.credentialGen.resources.requests.memory Resource requests (memory) for the credential generator Job.
          memory: 64Mi
  ## @section CruiseKube Controller usage telemetry (optional heartbeats)
  usageTelemetry:
    ## @param cruisekubeController.usageTelemetry.enabled Send anonymous usage heartbeats when true (requires provider api_key baked into the image at build USAGETELEMETRY_PROVIDER_API_KEY, or providerConfig.api_key in values for overrides; host from providerConfig.host or client default). When enabled, the chart ensures a chart-managed Secret named `{controller-fullname}-runtime-data` with key `install-id` (bootstrap hook) for the stable distinct id; that Secret may hold additional controller data keys in the future.
    enabled: true
    ## @param cruisekubeController.usageTelemetry.interval Heartbeat period (Go duration, e.g. 30m, 1h).
    interval: 30m
    providerConfig:
      ## @param cruisekubeController.usageTelemetry.providerConfig.host Usage Telemetry provider host (JSON in CRUISEKUBE_USAGETELEMETRY_PROVIDERCONFIG)
      host: "https://us.i.posthog.com"
  ## @param cruisekubeController.replicas Number of CruiseKube Controller replicas to deploy
  replicas: 1
  image:
    ## @param cruisekubeController.image.repository CruiseKube Controller image repository
    repository: tfy.jfrog.io/tfy-images/cruisekube
    ## @param cruisekubeController.image.imagePullPolicy CruiseKube Controller image pull policy
    imagePullPolicy: IfNotPresent
    ## @param cruisekubeController.image.tag CruiseKube Controller image tag (immutable tags are recommended)
    tag: "0.3.1"
  ## @param cruisekubeController.imagePullSecrets [array] CruiseKube Controller image pull secrets
  imagePullSecrets: []
  ## @param cruisekubeController.nameOverride String to partially override cruisekube.fullname
  nameOverride: ""
  ## @param cruisekubeController.fullnameOverride String to fully override cruisekube.fullname
  fullnameOverride: ""
  controller:
    ## @param cruisekubeController.controller.mode Controller mode (inCluster or external)
    mode: "in-cluster"
  serviceAccount:
    ## @param cruisekubeController.serviceAccount.create Specifies whether a ServiceAccount should be created
    create: true
    ## @param cruisekubeController.serviceAccount.name The name of the ServiceAccount to use
    name: ""
  rbac:
    ## @param cruisekubeController.rbac.create Specifies whether RBAC resources should be created
    create: true
  ## @param cruisekubeController.podAnnotations [object] Annotations for CruiseKube Controller pods
  podAnnotations: {}
  ## @param cruisekubeController.podLabels [object] Extra labels for CruiseKube Controller pods
  podLabels: {}
  service:
    ## @param cruisekubeController.service.type CruiseKube Controller service type
    type: ClusterIP
    ## @param cruisekubeController.service.httpPort CruiseKube Controller service HTTP port
    httpPort: 8080
    ## @param cruisekubeController.service.metricsPort CruiseKube Controller service metrics port
    metricsPort: 8081
    ## @param cruisekubeController.service.annotations [object] Additional custom annotations for the service
    annotations: {}
  serviceMonitor:
    ## @param cruisekubeController.serviceMonitor.enabled Create ServiceMonitor resource(s) for scraping metrics using PrometheusOperator
    enabled: true
    ## @param cruisekubeController.serviceMonitor.jobLabel The name of the label on the target service to use as the job name in Prometheus
    jobLabel: cruisekube-controller
    ## @param cruisekubeController.serviceMonitor.additionalLabels [object] Additional labels that can be used so ServiceMonitor resource(s) can be discovered by Prometheus
    additionalLabels: {}
    ## @param cruisekubeController.serviceMonitor.additionalAnnotations [object] Additional annotations for the ServiceMonitor resource(s)
    additionalAnnotations: {}
    ## @param cruisekubeController.serviceMonitor.endpoints [array] ServiceMonitor endpoints configuration
    endpoints:
      - port: metrics
        path: /metrics
        interval: 30s
        scrapeTimeout: 10s
  resources:
    limits:
      ## @param cruisekubeController.resources.limits.cpu The resources limits (CPU) for the CruiseKube Controller containers
      cpu: 500m
      ## @param cruisekubeController.resources.limits.memory The resources limits (memory) for the CruiseKube Controller containers
      memory: 512Mi
    requests:
      ## @param cruisekubeController.resources.requests.cpu The requested resources (CPU) for the CruiseKube Controller containers
      cpu: 100m
      ## @param cruisekubeController.resources.requests.memory The requested resources (memory) for the CruiseKube Controller containers
      memory: 128Mi
  ## @param cruisekubeController.volumeMounts [array] Optionally specify extra list of additional volumeMounts for the CruiseKube Controller container(s)
  volumeMounts: []
  ## @param cruisekubeController.env [object] Environment variables to configure CruiseKube Controller. It is used to update the default values in the config file.
  env:
    CRUISEKUBE_DEPENDENCIES_LOCAL_KUBECONFIGPATH: ""
    CRUISEKUBE_DEPENDENCIES_LOCAL_PROMETHEUSURL: "http://localhost:9090"
    CRUISEKUBE_DEPENDENCIES_LOCAL_INSECURESKIPTLSVERIFY: "false"
    # When kube-prometheus-stack.enabled=true the controller uses the bundled Prometheus automatically
    # (the deployment template overrides this value with the computed in-cluster URL).
    # When pointing at an external Prometheus, set this to your Prometheus's in-cluster service URL, e.g.:
    #   http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090   (standalone kube-prometheus-stack release "prometheus" in namespace "monitoring")
    #   http://<release>-kube-prometheus-stack-prometheus.<namespace>.svc:9090  (bundled, using release name + namespace)
    CRUISEKUBE_DEPENDENCIES_INCLUSTER_PROMETHEUSURL: "http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090"
    CRUISEKUBE_DEPENDENCIES_INCLUSTER_INSECURESKIPTLSVERIFY: "false"
    CRUISEKUBE_EXECUTIONMODE: "controller"
    CRUISEKUBE_CONTROLLER_TARGETNAMESPACE: ""
    CRUISEKUBE_CONTROLLER_TARGETCLUSTERID: ""
    CRUISEKUBE_CONTROLLER_TASKS_CREATESTATS_ENABLED: "true"
    CRUISEKUBE_CONTROLLER_TASKS_CREATESTATS_SCHEDULE: "15m"
    CRUISEKUBE_CONTROLLER_TASKS_CREATESTATS_METADATA_SKIPMEMORY: "false"
    CRUISEKUBE_CONTROLLER_TASKS_APPLYRECOMMENDATION_ENABLED: "true"
    CRUISEKUBE_CONTROLLER_TASKS_APPLYRECOMMENDATION_SCHEDULE: "5m"
    CRUISEKUBE_CONTROLLER_TASKS_APPLYRECOMMENDATION_METADATA_SKIPMEMORY: "false"
    CRUISEKUBE_CONTROLLER_TASKS_APPLYRECOMMENDATION_METADATA_NODESTATSURL_HOST: "http://localhost:8080"
    CRUISEKUBE_CONTROLLER_TASKS_APPLYRECOMMENDATION_METADATA_OVERRIDESURL_HOST: "http://localhost:8080"
    CRUISEKUBE_CONTROLLER_TASKS_NODELOADMONITORING_ENABLED: "true"
    CRUISEKUBE_CONTROLLER_TASKS_NODELOADMONITORING_SCHEDULE: "60s"
    CRUISEKUBE_CONTROLLER_TASKS_FETCHMETRICS_ENABLED: "true"
    CRUISEKUBE_CONTROLLER_TASKS_FETCHMETRICS_SCHEDULE: "1m"
    CRUISEKUBE_CONTROLLER_TASKS_CLEANUP_ENABLED: "true"
    CRUISEKUBE_CONTROLLER_TASKS_CLEANUP_SCHEDULE: "24h"
    CRUISEKUBE_CONTROLLER_TASKS_CLEANUP_METADATA_RETENTIONDAYS: "7"
    CRUISEKUBE_CONTROLLER_TASKS_DISRUPTIONFORCE_ENABLED: "true"
    CRUISEKUBE_CONTROLLER_TASKS_DISRUPTIONFORCE_SCHEDULE: "5m"
    CRUISEKUBE_METRICS_ENABLED: "true"
    CRUISEKUBE_METRICS_PORT: "8081"
    CRUISEKUBE_SERVER_PORT: "8080"
    CRUISEKUBE_DB_TYPE: "postgres"
    CRUISEKUBE_DB_SSLMODE: "disable"
    CRUISEKUBE_RECOMMENDATIONSETTINGS_NEWWORKLOADTHRESHOLDHOURS: "1"
    CRUISEKUBE_RECOMMENDATIONSETTINGS_DISABLEMEMORYAPPLICATION: "false"
    CRUISEKUBE_RECOMMENDATIONSETTINGS_MAXCONCURRENTQUERIES: "30"
    CRUISEKUBE_RECOMMENDATIONSETTINGS_OOMCOOLDOWNMINUTES: "5"
    CRUISEKUBE_TELEMETRY_ENABLED: "false"
    CRUISEKUBE_TELEMETRY_EXPORTEROTLPENDPOINT: ""
    CRUISEKUBE_TELEMETRY_EXPORTEROTLPHEADERS: ""
    CRUISEKUBE_TELEMETRY_SERVICENAME: ""
    CRUISEKUBE_TELEMETRY_TRACERATIO: "0.1"
    CRUISEKUBE_SENTRY_ENABLED: "false"
    CRUISEKUBE_SENTRY_DSN: ""
    CRUISEKUBE_SENTRY_ENVIRONMENT: ""

