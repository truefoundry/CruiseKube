## @section kube-prometheus-stack parameters
## Optional bundled Prometheus stack. Disabled by default. Enable when you do not already have
## a Prometheus Operator installed in the cluster.
##
## IMPORTANT — namespace:
##   Everything is installed into .Release.Namespace (not a dedicated "monitoring" namespace).
##   When enabled, update CRUISEKUBE_DEPENDENCIES_INCLUSTER_PROMETHEUSURL if you are overriding
##   it manually; otherwise the chart computes the correct in-cluster URL automatically.
##
## IMPORTANT — bundled operator is SCOPED by default (separate config control, no operator war):
##   When prometheusOperator.enabled=true the bundled operator OWNS Prometheus/Alertmanager instances only
##   if they (a) live in the install namespace (prometheusInstanceNamespaces, default "cruisekube-system")
##   AND (b) carry the unique label cruisekube.com/prometheus=bundled (prometheusInstanceSelector). The chart
##   stamps that label on its own CR (prometheus.additionalLabels), so the bundled operator manages exactly
##   one instance — its own — and can never adopt an existing cluster-wide instance. Ownership scoping does
##   NOT limit ServiceMonitor discovery, so the bundled Prometheus still scrapes kubelet/cAdvisor and
##   exporters cluster-wide.
##   Two things to know:
##     1. If you install CruiseKube in a namespace other than "cruisekube-system", update
##        prometheusInstanceNamespaces / alertmanagerInstanceNamespaces to match (or set [] to rely on the
##        unique label selector alone, which is namespace-independent).
##     2. The unique label scopes only the BUNDLED operator. An existing CLUSTER-WIDE operator still matches
##        the bundled instance (its selector is empty = matches all), so it must be told to ignore it. Either
##        give it a selector that excludes the label — prometheusInstanceSelector: "cruisekube.com/prometheus!=bundled"
##        (matches every instance that lacks/differs on the label, i.e. all its own) — or exclude this
##        namespace via prometheusOperator.denyNamespaces. This edit to the existing release is unavoidable
##        while it is cluster-wide. See docs/install/gs-prerequisites.md ("Option C").
##   Because CRDs and admission webhooks are cluster-scoped, when coexisting with another operator also set
##   crds.enabled=false (reuse the shared CRDs) and prometheusOperator.admissionWebhooks.enabled=false /
##   kubeletService.enabled=false so the two do not fight over cluster-scoped objects.
##
## IMPORTANT — node-exporter (one per node) vs kube-state-metrics (safe to duplicate):
##   node-exporter uses hostNetwork and binds port 9100 on each node. A second DaemonSet cannot
##   schedule ("didn't have free ports"). When another stack already runs it (e.g. monitoring), set
##   nodeExporter.enabled=false so the bundled Prometheus scrapes the existing one.
##   kube-state-metrics is a plain Deployment (no hostNetwork/hostPort), so a second copy coexists
##   fine — disabling it is OPTIONAL (only avoids a duplicate). See docs/install/gs-prerequisites.md.
##
## IMPORTANT — Prometheus storage:
##   This chart sets a persistent storageSpec + retention by default (see prometheus.prometheusSpec below)
##   because CruiseKube needs metric history. It uses the cluster's default StorageClass; set
##   storageClassName explicitly if there is no default, or set storageSpec: null to run ephemeral.
##
## IMPORTANT — ServiceMonitor discovery:
##   The bundled Prometheus uses an empty serviceMonitorSelector so it discovers ServiceMonitors
##   cluster-wide (this chart's monitors, plus existing node-exporter/kube-state-metrics elsewhere).
##   CruiseKube ServiceMonitors still carry release: prometheus for compatibility with external Prometheus.

# NOTE: keys under kube-prometheus-stack are passed through to the kube-prometheus-stack subchart.

kube-prometheus-stack:
  ## @param kube-prometheus-stack.enabled Deploy the bundled kube-prometheus-stack (Prometheus Operator + Prometheus + kube-state-metrics + node-exporter). Off by default.
  enabled: false

  crds:
    ## @param kube-prometheus-stack.crds.enabled Install/upgrade Prometheus Operator CRDs as part of this chart. Set to false if compatible CRDs are already present.
    enabled: true

  ## @param kube-prometheus-stack.prometheusOperator.enabled Deploy the Prometheus Operator. Set false when a cluster-wide operator already exists, so the existing operator reconciles this chart's Prometheus CR (avoids two operators fighting over the same StatefulSets).
  prometheusOperator:
    enabled: true

    ## Scoped by DEFAULT — this operator only OWNS Prometheus/Alertmanager instances in the namespaces
    ## listed below, so a bundled operator never fights an existing cluster-wide operator over StatefulSets.
    ## This scopes instance OWNERSHIP only; ServiceMonitor/endpoint discovery stays cluster-wide, so the
    ## bundled Prometheus still scrapes kubelet/cAdvisor and exporters in every namespace.
    ##
    ## IMPORTANT — these must list the namespace where CruiseKube (and thus its Prometheus CR) is installed.
    ## They default to "cruisekube-system" (the documented install namespace). If you install CruiseKube in a
    ## DIFFERENT namespace and enable this operator, change these to that namespace — otherwise the operator
    ## will not adopt the Prometheus CR and no Prometheus pod is created. Set to [] to run cluster-wide.
    ##
    ## @param kube-prometheus-stack.prometheusOperator.prometheusInstanceNamespaces [array] Namespaces this operator looks in for Prometheus CRs to own. Defaults to the install namespace so a bundled operator does not fight an existing cluster-wide operator. ServiceMonitor discovery stays broad. Set to [] for cluster-wide ownership.
    prometheusInstanceNamespaces:
      - cruisekube-system
    ## @param kube-prometheus-stack.prometheusOperator.alertmanagerInstanceNamespaces [array] Namespaces this operator owns Alertmanager CRs in. Scoped alongside prometheusInstanceNamespaces. Set to [] for cluster-wide ownership.
    alertmanagerInstanceNamespaces:
      - cruisekube-system

    ## UNIQUE INSTANCE SELECTORS — second layer of ownership scoping, by label rather than namespace.
    ## The bundled operator only OWNS Prometheus/Alertmanager CRs that carry the label below, which the
    ## chart stamps onto its own CR (see prometheus.additionalLabels / alertmanager.additionalLabels).
    ## No other instance in the cluster carries this label, so the bundled operator can never adopt an
    ## existing instance — and, crucially, it gives the EXISTING cluster-wide operator a way to ignore the
    ## bundled instance without listing namespaces: set the existing operator's prometheusInstanceSelector to
    ## "cruisekube.com/prometheus!=bundled" (matches everything that lacks/differs on the label). See
    ## docs/install/gs-prerequisites.md ("Option C").
    ## NOTE: namespace scoping (above) and this label selector are ANDed — a CR must satisfy BOTH to be
    ## owned. The bundled CR is in the install namespace AND carries the label, so it qualifies. Set the
    ## namespaces to [] if you prefer to scope by label only (namespace-independent).
    ## @param kube-prometheus-stack.prometheusOperator.prometheusInstanceSelector Label selector for Prometheus CRs this operator owns. Defaults to the unique label the chart stamps on its own CR so the bundled operator only ever manages the bundled Prometheus.
    prometheusInstanceSelector: "cruisekube.com/prometheus=bundled"
    ## @param kube-prometheus-stack.prometheusOperator.alertmanagerInstanceSelector Label selector for Alertmanager CRs this operator owns. Mirrors prometheusInstanceSelector (moot while alertmanager.enabled=false).
    alertmanagerInstanceSelector: "cruisekube.com/prometheus=bundled"
    ## @param kube-prometheus-stack.prometheusOperator.admissionWebhooks.enabled Install the cluster-scoped PrometheusRule admission webhook. Set false when a second operator already provides it (the webhook is cluster-wide; two are redundant/conflicting).
    admissionWebhooks:
      enabled: true
    ## @param kube-prometheus-stack.prometheusOperator.kubeletService.enabled Have this operator create/maintain the cluster-wide kubelet Service in kube-system. Set false when another operator already manages it, to avoid two operators reconciling the same Service.
    kubeletService:
      enabled: true

  ## Disable unneeded components — CruiseKube only needs Prometheus + its scrapers.
  ## @param kube-prometheus-stack.alertmanager.enabled Disable Alertmanager (not used by CruiseKube).
  alertmanager:
    enabled: false
    ## @param kube-prometheus-stack.alertmanager.additionalLabels Labels added to the Alertmanager CR so the bundled operator's alertmanagerInstanceSelector matches it. Moot while alertmanager.enabled=false, kept for consistency if you enable it.
    additionalLabels:
      cruisekube.com/prometheus: bundled
  ## @param kube-prometheus-stack.grafana.enabled Disable Grafana (not used by CruiseKube).
  grafana:
    enabled: false
  ## @param kube-prometheus-stack.prometheus-windows-exporter.enabled Disable Windows node exporter.
  prometheus-windows-exporter:
    enabled: false
  ## @param kube-prometheus-stack.defaultRules.create Disable default alerting rules (no Alertmanager to receive them).
  defaultRules:
    create: false

  ## @param kube-prometheus-stack.nodeExporter.enabled Deploy node-exporter DaemonSet. Set false when another stack already runs node-exporter (host port 9100 is per-node).
  nodeExporter:
    enabled: true

  ## @param kube-prometheus-stack.kubeStateMetrics.enabled Deploy kube-state-metrics. Safe to leave enabled even when another stack runs it (plain Deployment, no host ports); set false only to avoid a duplicate.
  kubeStateMetrics:
    enabled: true

  ## Prometheus instance configuration.
  prometheus:
    ## @param kube-prometheus-stack.prometheus.additionalLabels Labels added to the Prometheus CR. The unique label here is what prometheusOperator.prometheusInstanceSelector matches, so the bundled operator (and only it) owns this instance. Keep in sync with that selector.
    additionalLabels:
      cruisekube.com/prometheus: bundled
    prometheusSpec:
      ## @param kube-prometheus-stack.prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues Set to false so the explicit selector below is honored.
      serviceMonitorSelectorNilUsesHelmValues: false
      ## @param kube-prometheus-stack.prometheus.prometheusSpec.serviceMonitorSelector Empty selector: discover ServiceMonitors in all namespaces (existing exporters + this chart).
      serviceMonitorSelector: {}
      ## @param kube-prometheus-stack.prometheus.prometheusSpec.serviceMonitorNamespaceSelector Match ServiceMonitors in all namespaces.
      serviceMonitorNamespaceSelector: {}

      ## Persistent TSDB by default — CruiseKube needs metric history to produce good recommendations.
      ## Without storage the bundled Prometheus uses an EmptyDir and loses all data on pod restart.
      ## @param kube-prometheus-stack.prometheus.prometheusSpec.retention How long the bundled Prometheus keeps metrics.
      retention: 15d
      ## storageSpec provisions a PVC via the StatefulSet volumeClaimTemplate.
      ## storageClassName is intentionally unset so the cluster's default StorageClass is used; set it
      ## explicitly if there is no default. To run ephemeral (e.g. throwaway tests), set storageSpec: null.
      ## @param kube-prometheus-stack.prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.accessModes [array] Access modes for the Prometheus PVC.
      ## @param kube-prometheus-stack.prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage Size of the Prometheus PVC.
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
