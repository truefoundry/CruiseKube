{{- if and .Values.cruisekubeController.enabled (not .Values.cruisekubeController.admin.existingSecret) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cruisekubeController.fullname" . }}-admin-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cruisekubeController.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      name: {{ include "cruisekubeController.fullname" . }}-admin-credentials
      labels:
        {{- include "cruisekubeController.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "cruisekubeController.adminCredentialGen.serviceAccountName" . }}
      {{- with .Values.cruisekubeController.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: admin-credentials
          image: "{{ .Values.cruisekubeController.admin.credentialGen.image.repository }}:{{ .Values.cruisekubeController.admin.credentialGen.image.tag }}"
          imagePullPolicy: {{ .Values.cruisekubeController.admin.credentialGen.image.imagePullPolicy }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              print_retrieve_cmds() {
                echo "Read admin username:"
                echo "kubectl get secret ${TARGET_SECRET_NAME} -n ${TARGET_NAMESPACE} -o jsonpath=\"{.data['${USER_KEY}']}\" | base64 -d && echo"
                echo "Read admin password:"
                echo "kubectl get secret ${TARGET_SECRET_NAME} -n ${TARGET_NAMESPACE} -o jsonpath=\"{.data['${PASS_KEY}']}\" | base64 -d && echo"
              }
              if kubectl get secret "$TARGET_SECRET_NAME" -n "$TARGET_NAMESPACE" >/dev/null 2>&1; then
                echo "Secret ${TARGET_SECRET_NAME} already exists; not overwriting."
                print_retrieve_cmds
                exit 0
              fi
              # tr|head makes head close the pipe; with pipefail tr gets SIGPIPE (exit 141) and the job fails.
              set +o pipefail
              u="cruisekube"
              p="$(tr -dc 'a-zA-Z0-9' </dev/urandom | head -c 32)"
              set -o pipefail
              kubectl create secret generic "$TARGET_SECRET_NAME" -n "$TARGET_NAMESPACE" \
                --from-literal="${USER_KEY}=${u}" \
                --from-literal="${PASS_KEY}=${p}"
              echo "Created secret ${TARGET_SECRET_NAME}."
              print_retrieve_cmds
          env:
            - name: TARGET_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: TARGET_SECRET_NAME
              value: {{ include "cruisekubeController.adminSecretName" . | quote }}
            - name: USER_KEY
              value: {{ .Values.cruisekubeController.admin.userKey | quote }}
            - name: PASS_KEY
              value: {{ .Values.cruisekubeController.admin.passwordKey | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.cruisekubeController.admin.credentialGen.resources | nindent 12 }}
{{- end }}
