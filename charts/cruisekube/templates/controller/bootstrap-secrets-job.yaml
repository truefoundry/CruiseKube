{{- if eq (include "cruisekubeController.bootstrapSecretsJobEnabled" . | trim) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cruisekubeController.fullname" . }}-bootstrap-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cruisekubeController.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      name: {{ include "cruisekubeController.fullname" . }}-bootstrap-secrets
      labels:
        {{- include "cruisekubeController.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "cruisekubeController.adminCredentialGen.serviceAccountName" . }}
      {{- with .Values.cruisekubeController.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: bootstrap-secrets
          image: "{{ .Values.cruisekubeController.admin.credentialGen.image.repository }}:{{ .Values.cruisekubeController.admin.credentialGen.image.tag }}"
          imagePullPolicy: {{ .Values.cruisekubeController.admin.credentialGen.image.imagePullPolicy }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              ensure_install_id() {
                if [ "${MANAGE_INSTALL_ID}" != "true" ]; then
                  return 0
                fi
                if kubectl get secret "${RUNTIME_DATA_SECRET_NAME}" -n "${TARGET_NAMESPACE}" >/dev/null 2>&1; then
                  existing=$(kubectl get secret "${RUNTIME_DATA_SECRET_NAME}" -n "${TARGET_NAMESPACE}" -o "jsonpath={.data['${INSTALL_ID_KEY}']}" 2>/dev/null || true)
                  if [ -n "${existing}" ]; then
                    echo "Install id key present in ${RUNTIME_DATA_SECRET_NAME}; not overwriting."
                    return 0
                  fi
                  set +o pipefail
                  id="$(tr -dc 'a-zA-Z0-9' </dev/urandom | head -c 32)"
                  set -o pipefail
                  b64=$(printf '%s' "${id}" | base64 -w0)
                  kubectl patch secret "${RUNTIME_DATA_SECRET_NAME}" -n "${TARGET_NAMESPACE}" --type=json -p="[{\"op\":\"add\",\"path\":\"/data/${INSTALL_ID_KEY}\",\"value\":\"${b64}\"}]"
                  echo "Patched install id into secret ${RUNTIME_DATA_SECRET_NAME}."
                  return 0
                fi
                set +o pipefail
                id="$(tr -dc 'a-zA-Z0-9' </dev/urandom | head -c 32)"
                set -o pipefail
                kubectl create secret generic "${RUNTIME_DATA_SECRET_NAME}" -n "${TARGET_NAMESPACE}" \
                  --from-literal="${INSTALL_ID_KEY}=${id}"
                echo "Created runtime-data secret ${RUNTIME_DATA_SECRET_NAME}."
              }
              print_retrieve_cmds() {
                echo "Read admin username:"
                echo "kubectl get secret ${TARGET_SECRET_NAME} -n ${TARGET_NAMESPACE} -o jsonpath=\"{.data['${USER_KEY}']}\" | base64 -d && echo"
                echo "Read admin password:"
                echo "kubectl get secret ${TARGET_SECRET_NAME} -n ${TARGET_NAMESPACE} -o jsonpath=\"{.data['${PASS_KEY}']}\" | base64 -d && echo"
              }
              ensure_install_id
              if [ "${MANAGE_ADMIN}" != "true" ]; then
                exit 0
              fi
              if kubectl get secret "$TARGET_SECRET_NAME" -n "$TARGET_NAMESPACE" >/dev/null 2>&1; then
                echo "Secret ${TARGET_SECRET_NAME} already exists; not overwriting."
                print_retrieve_cmds
                exit 0
              fi
              set +o pipefail
              u="cruisekube"
              p="$(tr -dc 'a-zA-Z0-9' </dev/urandom | head -c 32)"
              set -o pipefail
              kubectl create secret generic "$TARGET_SECRET_NAME" -n "$TARGET_NAMESPACE" \
                --from-literal="${USER_KEY}=${u}" \
                --from-literal="${PASS_KEY}=${p}"
              echo "Created secret ${TARGET_SECRET_NAME}."
              print_retrieve_cmds
          env:
            - name: TARGET_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: TARGET_SECRET_NAME
              value: {{ include "cruisekubeController.adminSecretName" . | quote }}
            - name: USER_KEY
              value: {{ .Values.cruisekubeController.admin.userKey | quote }}
            - name: PASS_KEY
              value: {{ .Values.cruisekubeController.admin.passwordKey | quote }}
            {{- $adminEnabled := eq (include "cruisekubeController.adminEnabled" . | trim) "true" }}
            - name: MANAGE_ADMIN
              value: {{ ternary "true" "false" (and $adminEnabled (not .Values.cruisekubeController.admin.existingSecret)) | quote }}
            - name: MANAGE_INSTALL_ID
              value: {{ $ut := .Values.cruisekubeController.usageTelemetry | default dict }}{{ ternary "true" "false" ($ut.enabled | default false) | quote }}
            - name: RUNTIME_DATA_SECRET_NAME
              value: {{ include "cruisekubeController.runtimeDataSecretName" . | quote }}
            - name: INSTALL_ID_KEY
              value: {{ include "cruisekubeController.runtimeDataSecretInstallIdKey" . | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.cruisekubeController.admin.credentialGen.resources | nindent 12 }}
{{- end }}
