{{- if .Values.cruisekubeController.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cruisekubeController.fullname" . }}
  labels:
    {{- include "cruisekubeController.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cruisekubeController.replicas }}
  selector:
    matchLabels:
      {{- include "cruisekubeController.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.cruisekubeController.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cruisekubeController.labels" . | nindent 8 }}
        {{- with .Values.cruisekubeController.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.cruisekubeController.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cruisekubeController.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}-controller
          image: "{{ .Values.cruisekubeController.image.repository }}:{{ include "cruisekubeController.imageTag" . }}"
          imagePullPolicy: {{ .Values.cruisekubeController.image.imagePullPolicy }}
          command: ["./cruisekube"]
          args:
            - "--execution-mode=controller"
            - "--controller-mode={{ .Values.cruisekubeController.controller.mode }}"
          ports:
            - name: http
              containerPort: {{ .Values.cruisekubeController.service.httpPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.cruisekubeController.service.metricsPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.cruisekubeController.service.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 6
          resources:
            {{- toYaml .Values.cruisekubeController.resources | nindent 12 }}
          env:
            {{- if .Values.global.postgresql.auth }}
            {{- if .Values.global.postgresql.auth.host }}
            - name: CRUISEKUBE_DB_HOST
              value: {{ .Values.global.postgresql.auth.host | quote }}
            {{- end }}
            {{- if .Values.global.postgresql.auth.port }}
            - name: CRUISEKUBE_DB_PORT
              value: {{ .Values.global.postgresql.auth.port | toString | quote }}
            {{- end }}
            {{- if .Values.global.postgresql.auth.username }}
            - name: CRUISEKUBE_DB_USERNAME
              value: {{ .Values.global.postgresql.auth.username | quote }}
            {{- end }}
            {{- if .Values.global.postgresql.auth.password }}
            - name: CRUISEKUBE_DB_PASSWORD
              value: {{ .Values.global.postgresql.auth.password | quote }}
            {{- end }}
            {{- if .Values.global.postgresql.auth.database }}
            - name: CRUISEKUBE_DB_DATABASE
              value: {{ .Values.global.postgresql.auth.database | quote }}
            {{- end }}
            {{- end }}
            {{- range $key, $value := .Values.cruisekubeController.env }}
            {{- if and (eq $key "CRUISEKUBE_DEPENDENCIES_INCLUSTER_PROMETHEUSURL") (index $.Values "kube-prometheus-stack" "enabled") }}
            {{- /* Skipped: overridden below by the bundled Prometheus URL */ -}}
            {{- else }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if index .Values "kube-prometheus-stack" "enabled" }}
            - name: CRUISEKUBE_DEPENDENCIES_INCLUSTER_PROMETHEUSURL
              value: {{ include "cruisekube.bundledPrometheusUrl" . | quote }}
            {{- end }}
            {{- $adminEnabled := eq (include "cruisekubeController.adminEnabled" . | trim) "true" }}
            - name: CRUISEKUBE_SERVER_AUTH_ENABLED
              value: {{ $adminEnabled | quote }}
            {{- if $adminEnabled }}
            - name: CRUISEKUBE_SERVER_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "cruisekubeController.adminSecretName" . }}
                  key: {{ .Values.cruisekubeController.admin.userKey }}
            - name: CRUISEKUBE_SERVER_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cruisekubeController.adminSecretName" . }}
                  key: {{ .Values.cruisekubeController.admin.passwordKey }}
            {{- end }}
            {{- $ut := .Values.cruisekubeController.usageTelemetry | default dict }}
            - name: CRUISEKUBE_USAGETELEMETRY_ENABLED
              value: {{ $ut.enabled | default false | quote }}
            - name: CRUISEKUBE_USAGETELEMETRY_INTERVAL
              value: {{ $ut.interval | default "30m" | quote }}
            {{- if ($ut.enabled | default false) }}
            - name: CRUISEKUBE_USAGETELEMETRY_INSTALLID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cruisekubeController.runtimeDataSecretName" . }}
                  key: {{ include "cruisekubeController.runtimeDataSecretInstallIdKey" . }}
            - name: CRUISEKUBE_USAGETELEMETRY_PROVIDERCONFIG
              value: {{ $ut.providerConfig | default dict | toJson | quote }}
            - name: CRUISEKUBE_USAGETELEMETRY_HELMCHARTVERSION
              value: {{ .Chart.AppVersion | quote }}
            {{- end }}
          volumeMounts:
            {{- with .Values.cruisekubeController.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- end }}
