{{- if eq (include "cruisekubeController.bootstrapSecretsJobEnabled" . | trim) "true" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cruisekubeController.adminCredentialGen.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cruisekubeController.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cruisekubeController.adminCredentialGen.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cruisekubeController.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cruisekubeController.adminCredentialGen.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cruisekubeController.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cruisekubeController.adminCredentialGen.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cruisekubeController.adminCredentialGen.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
