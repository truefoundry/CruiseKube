{{- if and (index .Values "kube-prometheus-stack" "enabled") (not (index .Values "kube-prometheus-stack" "crds" "skipPreflightCheck")) }}
{{- $kps := index .Values "kube-prometheus-stack" }}
{{- $img := $kps.preflightJob.image }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-kps-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cruisekubeController.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-8"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      name: {{ .Release.Name }}-kps-preflight
      labels:
        {{- include "cruisekubeController.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}-kps-preflight
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: preflight
          image: "{{ $img.repository }}:{{ $img.tag }}"
          imagePullPolicy: {{ $img.imagePullPolicy }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail

              echo "[preflight] kube-prometheus-stack conflict detection running..."
              echo "[preflight] Release: ${THIS_RELEASE_NAME} / Namespace: ${THIS_RELEASE_NAMESPACE}"
              echo ""
              ERRORS=0

              # ---------------------------------------------------------------
              # 1. Check for existing Prometheus Operator CRDs and their owners
              # ---------------------------------------------------------------
              for CRD in prometheuses.monitoring.coreos.com \
                          servicemonitors.monitoring.coreos.com \
                          podmonitors.monitoring.coreos.com \
                          alertmanagers.monitoring.coreos.com; do
                if kubectl get crd "${CRD}" >/dev/null 2>&1; then
                  OWNER_RELEASE=$(kubectl get crd "${CRD}" \
                    -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || true)
                  OWNER_NS=$(kubectl get crd "${CRD}" \
                    -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-namespace}' 2>/dev/null || true)

                  if [ -n "${OWNER_RELEASE}" ] && [ "${OWNER_RELEASE}" != "${THIS_RELEASE_NAME}" ]; then
                    echo "ERROR: CRD '${CRD}' is owned by Helm release '${OWNER_RELEASE}'"
                    echo "       in namespace '${OWNER_NS}'."
                    echo "  Another kube-prometheus-stack is already managing Prometheus CRDs."
                    echo "  Options:"
                    echo "  A) Reuse the existing Prometheus — disable the bundle and point the"
                    echo "     controller at it:"
                    echo "       --set kube-prometheus-stack.enabled=false \\"
                    echo "       --set 'cruisekubeController.env.CRUISEKUBE_DEPENDENCIES_INCLUSTER_PROMETHEUSURL=<url>'"
                    echo "  B) Uninstall the conflicting release '${OWNER_RELEASE}' first."
                    echo "  C) After reviewing, skip this check:"
                    echo "       --set kube-prometheus-stack.crds.skipPreflightCheck=true"
                    echo ""
                    ERRORS=$((ERRORS + 1))
                    break  # One CRD ownership conflict is enough to abort
                  fi

                  if [ -z "${OWNER_RELEASE}" ]; then
                    MANAGED_BY=$(kubectl get crd "${CRD}" \
                      -o jsonpath='{.metadata.labels.app\.kubernetes\.io/managed-by}' 2>/dev/null || true)
                    if [ -z "${MANAGED_BY}" ]; then
                      echo "WARNING: CRD '${CRD}' exists but is not managed by any Helm release."
                      echo "  This may be from a manual install. Proceeding could cause CRD version conflicts."
                      echo "  To skip after review: --set kube-prometheus-stack.crds.skipPreflightCheck=true"
                    fi
                  fi
                fi
              done

              # ---------------------------------------------------------------
              # 2. Check for existing Prometheus Operator deployments
              # ---------------------------------------------------------------
              echo "[preflight] Checking for existing prometheus-operator Deployments..."
              EXISTING_OPS=$(kubectl get deployments --all-namespaces \
                -l "app.kubernetes.io/name=prometheus-operator" \
                --ignore-not-found \
                -o custom-columns="NS:.metadata.namespace,NAME:.metadata.name,RELEASE:.metadata.labels.release" \
                --no-headers 2>/dev/null || true)

              if [ -n "${EXISTING_OPS}" ]; then
                while IFS= read -r line; do
                  [ -z "${line}" ] && continue
                  OP_RELEASE=$(echo "${line}" | awk '{print $3}')
                  if [ -n "${OP_RELEASE}" ] && [ "${OP_RELEASE}" != "${THIS_RELEASE_NAME}" ] && [ "${OP_RELEASE}" != "<none>" ]; then
                    echo "ERROR: Found existing prometheus-operator Deployment (${line})."
                    echo "  Two prometheus-operators in the same cluster can conflict."
                    echo "  Options:"
                    echo "  A) Disable the bundle: --set kube-prometheus-stack.enabled=false"
                    echo "  B) Uninstall the conflicting prometheus-operator first."
                    echo "  C) After reviewing: --set kube-prometheus-stack.crds.skipPreflightCheck=true"
                    echo ""
                    ERRORS=$((ERRORS + 1))
                  fi
                done <<< "${EXISTING_OPS}"
              fi

              # ---------------------------------------------------------------
              # 3. Check for existing Prometheus CRs in the release namespace
              # ---------------------------------------------------------------
              if kubectl get crd prometheuses.monitoring.coreos.com >/dev/null 2>&1; then
                echo "[preflight] Checking for existing Prometheus CRs in '${THIS_RELEASE_NAMESPACE}'..."
                EXISTING_PROM=$(kubectl get prometheus -n "${THIS_RELEASE_NAMESPACE}" \
                  --ignore-not-found \
                  -o custom-columns="NAME:.metadata.name,RELEASE:.metadata.labels.release" \
                  --no-headers 2>/dev/null || true)
                if [ -n "${EXISTING_PROM}" ]; then
                  while IFS= read -r line; do
                    [ -z "${line}" ] && continue
                    PROM_RELEASE=$(echo "${line}" | awk '{print $2}')
                    if [ -n "${PROM_RELEASE}" ] && [ "${PROM_RELEASE}" != "${THIS_RELEASE_NAME}" ] && [ "${PROM_RELEASE}" != "<none>" ]; then
                      echo "ERROR: Found existing Prometheus CR '${line}' in namespace '${THIS_RELEASE_NAMESPACE}'."
                      echo "  The bundled stack would deploy a second Prometheus in the same namespace."
                      echo "  Options:"
                      echo "  A) Use a different namespace for this release."
                      echo "  B) Disable the bundle: --set kube-prometheus-stack.enabled=false"
                      echo "  C) After reviewing: --set kube-prometheus-stack.crds.skipPreflightCheck=true"
                      echo ""
                      ERRORS=$((ERRORS + 1))
                    fi
                  done <<< "${EXISTING_PROM}"
                fi
              fi

              # ---------------------------------------------------------------
              # 4. node-exporter host port conflict (only one DaemonSet per node)
              # ---------------------------------------------------------------
              if [ "${BUNDLED_NODE_EXPORTER}" = "true" ]; then
                echo "[preflight] Checking for existing node-exporter DaemonSets (host port 9100)..."
                EXISTING_NE=$(kubectl get daemonsets --all-namespaces \
                  -l "app.kubernetes.io/name=prometheus-node-exporter" \
                  --ignore-not-found \
                  -o custom-columns="NS:.metadata.namespace,NAME:.metadata.name" \
                  --no-headers 2>/dev/null || true)
                if [ -n "${EXISTING_NE}" ]; then
                  echo "ERROR: Bundled node-exporter is enabled but another node-exporter DaemonSet already exists:"
                  echo "${EXISTING_NE}" | sed 's/^/  /'
                  echo "  Only one node-exporter can bind port 9100 per node (hostNetwork)."
                  echo "  Options:"
                  echo "  A) Reuse the existing exporter (recommended):"
                  echo "       --set kube-prometheus-stack.nodeExporter.enabled=false"
                  echo "  B) Use the existing Prometheus instead of the bundle:"
                  echo "       --set kube-prometheus-stack.enabled=false \\"
                  echo "       --set 'cruisekubeController.env.CRUISEKUBE_DEPENDENCIES_INCLUSTER_PROMETHEUSURL=<url>'"
                  echo ""
                  ERRORS=$((ERRORS + 1))
                fi
              fi

              # ---------------------------------------------------------------
              # Summary
              # ---------------------------------------------------------------
              if [ "${ERRORS}" -gt "0" ]; then
                echo "[preflight] FAILED: ${ERRORS} conflict(s) detected. See messages above."
                exit 1
              fi
              echo "[preflight] All checks passed. Proceeding with kube-prometheus-stack installation."
              exit 0
          env:
            - name: THIS_RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: THIS_RELEASE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: BUNDLED_NODE_EXPORTER
              {{- $neEnabled := true }}
              {{- if hasKey (default dict $kps.nodeExporter) "enabled" }}
              {{- $neEnabled = $kps.nodeExporter.enabled }}
              {{- end }}
              value: {{ $neEnabled | ternary "true" "false" | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml $kps.preflightJob.resources | nindent 12 }}
{{- end }}
