{{- if and (index .Values "kube-prometheus-stack" "enabled") (not (index .Values "kube-prometheus-stack" "crds" "skipPreflightCheck")) }}
{{- $kps := index .Values "kube-prometheus-stack" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-kps-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cruisekubeController.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Include release namespace in the name to avoid collisions in multi-release clusters.
  name: {{ printf "%s-%s-kps-preflight" .Release.Name .Release.Namespace | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "cruisekubeController.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  # Needed to inspect existing Prometheus Operator CRDs and check ownership annotations.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  # Needed to list existing Prometheus operator Deployments and node-exporter DaemonSets cluster-wide.
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["list"]
  # Needed to list Prometheus CRs in the release namespace (only if the CRD already exists).
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheuses"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-kps-preflight" .Release.Name .Release.Namespace | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "cruisekubeController.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s-kps-preflight" .Release.Name .Release.Namespace | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-kps-preflight
    namespace: {{ .Release.Namespace }}
{{- end }}
