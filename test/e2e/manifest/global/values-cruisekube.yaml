global:
  postgresql:
    auth:
      port: 5432
      username: "cruisekube"
      password: "cruisekube"
      database: "cruisekube"

cruisekubeController:
  enabled: true
  admin:
    existingSecret: "cruisekube-controller-admin-e2e-user-created"
    # This is used when we don't have to use and existing secret.
    credentialGen:
      image:
        # alpine/k8s (not alpine/kubectl): multi-arch and includes /bin/bash required by hook Jobs.
        repository: alpine/k8s
        tag: "1.36.0"
        imagePullPolicy: IfNotPresent
  usageTelemetry:
    enabled: false
    interval: 30m
    providerConfig: {}
  serviceMonitor:
    enabled: false
  image:
    repository: cruisekube
    tag: latest
    imagePullPolicy: Never
  env:
    CRUISEKUBE_DEPENDENCIES_LOCAL_INSECURESKIPTLSVERIFY: "false"
    CRUISEKUBE_DEPENDENCIES_INCLUSTER_PROMETHEUSURL: "http://localhost:9090"
    CRUISEKUBE_DEPENDENCIES_INCLUSTER_INSECURESKIPTLSVERIFY: "false"
    CRUISEKUBE_CONTROLLER_TARGETCLUSTERID: "default"

    CRUISEKUBE_CONTROLLER_TASKS_CREATESTATS_ENABLED: "false"
    CRUISEKUBE_CONTROLLER_TASKS_MODIFYEQUEALCPURESOURCES_SCHEDULE: "15m"
    CRUISEKUBE_CONTROLLER_TASKS_NODELOADMONITORING_ENABLED: "false"
    CRUISEKUBE_CONTROLLER_TASKS_FETCHMETRICS_ENABLED: "false"
    CRUISEKUBE_CONTROLLER_TASKS_DISRUPTIONFORCE_ENABLED: "false"
    CRUISEKUBE_CONTROLLER_TASKS_CLEANUPOOMEVENT_ENABLED: "false"
    CRUISEKUBE_CONTROLLER_TASKS_APPLYRECOMMENDATION_ENABLED: "false"
    CRUISEKUBE_CONTROLLER_TASKS_APPLYRECOMMENDATION_METADATA_SKIPMEMORY: "false"
    CRUISEKUBE_CONTROLLER_TASKS_APPLYRECOMMENDATION_METADATA_NODESTATSURL_HOST: "http://localhost:8080"
    CRUISEKUBE_CONTROLLER_TASKS_APPLYRECOMMENDATION_METADATA_OVERRIDESURL_HOST: "http://localhost:8080"
    CRUISEKUBE_RECOMMENDATIONSETTINGS_NEWWORKLOADTHRESHOLDHOURS: "0"
    CRUISEKUBE_RECOMMENDATIONSETTINGS_DISABLEMEMORYAPPLICATION: "false"
    CRUISEKUBE_RECOMMENDATIONSETTINGS_OOMCOOLDOWNMINUTES: "1"
    CRUISEKUBE_SERVER_ENABLEDEVAPIS: "true"

postgresql:
  enabled: true
  auth:
    username: "cruisekube"
    password: "cruisekube"
    database: "cruisekube"

cruisekubeFrontend:
  enabled: false
  image:
    repository: cruisekube-frontend
    tag: latest
    imagePullPolicy: Never
  # backendURL: "http://cruisekube-controller.cruisekube-system.svc.cluster.local:8080"

cruisekubeWebhook:
  enabled: true
  image:
    repository: cruisekube
    tag: latest
    imagePullPolicy: Never
  env:
    CRUISEKUBE_RECOMMENDATIONSETTINGS_NEWWORKLOADTHRESHOLDHOURS: "0"
    CRUISEKUBE_RECOMMENDATIONSETTINGS_DISABLEMEMORYAPPLICATION: "false"
  serviceMonitor:
    enabled: false
  certGen:
    enabled: true
    image:
      repository: registry.k8s.io/ingress-nginx/kube-webhook-certgen
      tag: v1.5.2
      imagePullPolicy: IfNotPresent

kube-prometheus-stack:
  enabled: true
  # e2e Makefile install-prom may already run node-exporter in monitoring — do not deploy a second.
  nodeExporter:
    enabled: false
  kubeStateMetrics:
    enabled: true
