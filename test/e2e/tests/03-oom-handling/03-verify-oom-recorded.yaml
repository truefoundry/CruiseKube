---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - command: echo "Waiting for OOM processor to detect OOM, record it, and evict the pod..."
  - command: sleep 10
  - command: echo "Checking controller logs for OOM handling..."
  - command: kubectl logs -n cruisekube-system deploy/cruisekube-controller --tail=30
  - command: echo "Checking webhook logs..."
  - command: kubectl logs -n cruisekube-system deploy/cruisekube-webhook --tail=30
  - command: echo "Checking if new pod was created by deployment..."
  - command: kubectl get pods -n test-oom -l app=stress -o wide
