---
apiVersion: v1
kind: ConfigMap
metadata:
  name: populate-hpa-db-script
  namespace: cruisekube-system
data:
  populate.sql: |
    -- hpa-cpu-deployment: horizontally autoscaled on CPU.
    -- CPU stats would recommend 500m, but CruiseKube must NOT touch CPU.
    -- Memory should still be right-sized to 200M (limit 512M).
    INSERT INTO workloads (cluster_id, workload_id, stats, generated_at, created_at, updated_at, overrides)
    VALUES (
        'default',
        'Deployment:test-hpa:hpa-cpu-deployment',
        '{
          "workload": "Deployment:test-hpa:hpa-cpu-deployment",
          "kind": "Deployment",
          "namespace": "test-hpa",
          "name": "hpa-cpu-deployment",
          "creation_time": "2024-01-01T00:00:00Z",
          "is_horizontally_autoscaled_on_cpu": true,
          "is_horizontally_autoscaled_on_memory": false,
          "eviction_ranking": 2,
          "replicas": 2,
          "container_stats": [
            {
              "container_name": "app",
              "container_type": 3,
              "cpu_stats": {
                "max": 0.6,
                "p50": 0.2,
                "p75": 0.3
              },
              "memory_stats": {
                "max": 200.0,
                "p75": 150.0,
                "oom_memory": 0.0
              },
              "memory_7day": {
                "max": 220.0
              },
              "cpu_7day": {
                "max": 0.6,
                "p50": 0.2,
                "p75": 0.3,
                "p90": 0.45,
                "p99": 0.55
              },
              "simple_predictions_cpu": {
                "weekly_prediction": 0.4,
                "hourly_prediction": 0.35,
                "current_prediction": 0.3,
                "max_value": 0.5
              },
              "simple_predictions_memory": {
                "weekly_prediction": 180.0,
                "hourly_prediction": 170.0,
                "current_prediction": 160.0,
                "max_value": 200.0
              }
            }
          ],
          "original_container_resources": [
            {
              "name": "app",
              "type": 3,
              "cpu_request": 0.3,
              "cpu_limit": 0.6,
              "memory_request": 64.0,
              "memory_limit": 128.0
            }
          ]
        }',
        NOW() - INTERVAL '1 hour',
        NOW(),
        NOW(),
        '{"enabled": true}'
    );

    -- hpa-mem-deployment: horizontally autoscaled on memory.
    -- Memory stats would recommend 200M, but CruiseKube must NOT touch memory.
    -- CPU should still be right-sized to 500m.
    INSERT INTO workloads (cluster_id, workload_id, stats, generated_at, created_at, updated_at, overrides)
    VALUES (
        'default',
        'Deployment:test-hpa:hpa-mem-deployment',
        '{
          "workload": "Deployment:test-hpa:hpa-mem-deployment",
          "kind": "Deployment",
          "namespace": "test-hpa",
          "name": "hpa-mem-deployment",
          "creation_time": "2024-01-01T00:00:00Z",
          "is_horizontally_autoscaled_on_cpu": false,
          "is_horizontally_autoscaled_on_memory": true,
          "eviction_ranking": 2,
          "replicas": 1,
          "container_stats": [
            {
              "container_name": "app",
              "container_type": 3,
              "cpu_stats": {
                "max": 0.6,
                "p50": 0.2,
                "p75": 0.3
              },
              "memory_stats": {
                "max": 200.0,
                "p75": 150.0,
                "oom_memory": 0.0
              },
              "memory_7day": {
                "max": 220.0
              },
              "cpu_7day": {
                "max": 0.6,
                "p50": 0.2,
                "p75": 0.3,
                "p90": 0.45,
                "p99": 0.55
              },
              "simple_predictions_cpu": {
                "weekly_prediction": 0.4,
                "hourly_prediction": 0.35,
                "current_prediction": 0.3,
                "max_value": 0.5
              },
              "simple_predictions_memory": {
                "weekly_prediction": 180.0,
                "hourly_prediction": 170.0,
                "current_prediction": 160.0,
                "max_value": 200.0
              }
            }
          ],
          "original_container_resources": [
            {
              "name": "app",
              "type": 3,
              "cpu_request": 0.1,
              "cpu_limit": 0.2,
              "memory_request": 256.0,
              "memory_limit": 400.0
            }
          ]
        }',
        NOW() - INTERVAL '1 hour',
        NOW(),
        NOW(),
        '{"enabled": true}'
    );

    SELECT workload_id FROM workloads WHERE workload_id LIKE '%test-hpa%';
---
apiVersion: batch/v1
kind: Job
metadata:
  name: populate-hpa-db
  namespace: cruisekube-system
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: populate-db
        image: postgres:15-alpine
        command:
        - sh
        - -c
        - |
          set -euo pipefail
          echo "Waiting for postgres to be ready..."
          until pg_isready -h cruisekube-postgresql.cruisekube-system.svc.cluster.local -U cruisekube; do
            sleep 2
          done
          echo "Postgres is ready. Populating database..."
          psql -v ON_ERROR_STOP=1 -h cruisekube-postgresql.cruisekube-system.svc.cluster.local -U cruisekube -d cruisekube -f /scripts/populate.sql
          echo "Database populated successfully!"
        env:
        - name: PGPASSWORD
          value: cruisekube
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: populate-hpa-db-script
