apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - command: echo "=== WAITING FOR PODS TO BE RECREATED AND READY ==="
  - command: sleep 5
  - command: kubectl wait --for=condition=ready pod -l app=hpa-cpu -n test-hpa --timeout=60s
