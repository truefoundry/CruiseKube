---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - command: echo "=== RECORDING CURRENT POD RESOURCES (before webhook) ==="
  - command: kubectl get pods -n test-hpa -l app=hpa-cpu -o jsonpath='{range .items[*]}{.metadata.name}{" CPU:"}{.spec.containers[0].resources.requests.cpu}{" Memory:"}{.spec.containers[0].resources.requests.memory}{"\n"}{end}'
  - command: kubectl get pods -n test-hpa -l app=hpa-mem -o jsonpath='{range .items[*]}{.metadata.name}{" CPU:"}{.spec.containers[0].resources.requests.cpu}{" Memory:"}{.spec.containers[0].resources.requests.memory}{"\n"}{end}'
  - command: echo ""
  - command: echo "=== DELETING PODS TO TRIGGER RECREATION THROUGH THE WEBHOOK ==="
  - command: kubectl delete pod -n test-hpa -l app=hpa-cpu --wait=false
  - command: kubectl delete pod -n test-hpa -l app=hpa-mem --wait=false
  - command: echo "Pods deleted"
