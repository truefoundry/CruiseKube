---
apiVersion: v1
kind: Namespace
metadata:
  name: test-hpa
---
# Workload horizontally autoscaled on CPU. CruiseKube should right-size the CPU
# request (vertical) AND adjust the HPA's target utilization (horizontal) so the
# absolute per-pod scale-out point is preserved.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-coord-deployment
  namespace: test-hpa
  labels:
    app: hpa-coord
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hpa-coord
  template:
    metadata:
      labels:
        app: hpa-coord
    spec:
      containers:
      - name: app
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64M"
            cpu: "300m"
          limits:
            memory: "128M"
            cpu: "600m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-coord
  namespace: test-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpa-coord-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
