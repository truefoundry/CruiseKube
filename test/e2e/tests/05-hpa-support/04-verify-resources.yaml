---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - command: echo "=== HPA-COORD POD RESOURCES (CPU request should be right-sized to 150m) ==="
  - command: kubectl get pod -n test-hpa -l app=hpa-coord -o jsonpath='{range .items[*]}{.metadata.name}{" CPU:"}{.spec.containers[0].resources.requests.cpu}{" Memory:"}{.spec.containers[0].resources.requests.memory}{"\n"}{end}'
  - command: echo ""
  - command: echo "=== HPA TARGET (should be coordinated to 84%) ==="
  - command: kubectl get hpa -n test-hpa hpa-coord -o jsonpath='{range .spec.metrics[*]}{.resource.name}{"="}{.resource.target.averageUtilization}{"%\n"}{end}'
  - command: echo ""
  - command: echo "=== CONTROLLER LOGS ==="
  - command: kubectl logs -n cruisekube-system deploy/cruisekube-controller --tail=80
