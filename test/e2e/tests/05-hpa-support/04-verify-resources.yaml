---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - command: echo "=== HPA-CPU POD RESOURCES (CPU should be unchanged at 300m, memory optimized) ==="
  - command: kubectl get pod -n test-hpa -l app=hpa-cpu -o jsonpath='{range .items[*]}{.metadata.name}{" CPU:"}{.spec.containers[0].resources.requests.cpu}{" Memory:"}{.spec.containers[0].resources.requests.memory}{" MemLimit:"}{.spec.containers[0].resources.limits.memory}{"\n"}{end}'
  - command: echo ""
  - command: echo "=== HPA-MEM POD RESOURCES (memory should be unchanged at 256M/400M, CPU optimized) ==="
  - command: kubectl get pod -n test-hpa -l app=hpa-mem -o jsonpath='{range .items[*]}{.metadata.name}{" CPU:"}{.spec.containers[0].resources.requests.cpu}{" Memory:"}{.spec.containers[0].resources.requests.memory}{" MemLimit:"}{.spec.containers[0].resources.limits.memory}{"\n"}{end}'
  - command: echo ""
  - command: echo "=== HPA OBJECTS ==="
  - command: kubectl get hpa -n test-hpa
  - command: echo ""
  - command: echo "=== WEBHOOK LOGS ==="
  - command: kubectl logs -n cruisekube-system deploy/cruisekube-webhook --tail=40
