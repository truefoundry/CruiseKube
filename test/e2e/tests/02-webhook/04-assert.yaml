---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 60
---
# Redis after webhook: recommendation from DB stats (p75 cpu 0.3 -> 300m, memory 150M, limit 440M)
apiVersion: v1
kind: Pod
metadata:
  namespace: test-webhook
  labels:
    app: redis
spec:
  containers:
  - name: redis
    resources:
      requests:
        cpu: "300m"
        memory: "150M"
      limits:
        memory: "440M"
status:
  phase: Running
---
# Memcached after webhook: recommendation from DB stats (p75 -> 120m cpu, 60M memory, limit 180M)
apiVersion: v1
kind: Pod
metadata:
  namespace: test-webhook
  labels:
    app: memcached
spec:
  containers:
  - name: memcached
    resources:
      requests:
        cpu: "120m"
        memory: "60M"
      limits:
        memory: "180M"
status:
  phase: Running
