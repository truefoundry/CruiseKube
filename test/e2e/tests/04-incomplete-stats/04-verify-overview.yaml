---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - command: echo "=== VERIFYING /ui/overview RESPONSE ==="
  - command: |
      RESPONSE="$(kubectl run curl-overview-incomplete --rm -i --restart=Never --image=curlimages/curl:latest -n cruisekube-system -- \
        curl -s http://cruisekube-controller.cruisekube-system.svc.cluster.local:8080/api/v1/clusters/default/ui/overview)"
      export RESPONSE
      python3 - <<'PY'
      import json
      import math
      import os

      payload = json.loads(os.environ["RESPONSE"])
      adoption = payload["coverage"]["adoption"]
      cpu_stats = payload["cpuStats"]
      memory_stats = payload["memoryStats"]

      assert adoption["total"] == 1, adoption
      assert adoption["nonOptimizable"] == 1, adoption
      assert adoption["optimizable"] == 0, adoption
      assert adoption["optimizableButExcluded"] == 0, adoption
      assert math.isclose(cpu_stats["workloadRequested"], 0.6, rel_tol=0, abs_tol=1e-9), cpu_stats
      assert math.isclose(cpu_stats["recommended"], 0.6, rel_tol=0, abs_tol=1e-9), cpu_stats
      assert math.isclose(memory_stats["workloadRequested"], 0.192, rel_tol=0, abs_tol=1e-9), memory_stats
      assert math.isclose(memory_stats["recommended"], 0.192, rel_tol=0, abs_tol=1e-9), memory_stats
      print("Overview payload verified successfully")
      PY
