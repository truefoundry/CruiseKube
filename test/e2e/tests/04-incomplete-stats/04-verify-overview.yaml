---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - command: echo "=== VERIFYING /ui/overview RESPONSE ==="
  - command: |
      sh -ceu '
      RESPONSE="$(kubectl run curl-overview-incomplete --rm -i --restart=Never --image=docker.io/curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17 -n cruisekube-system -- \
        curl --fail -sS --max-time 10 http://cruisekube-controller.cruisekube-system.svc.cluster.local:8080/api/v1/clusters/default/ui/overview)"
      export RESPONSE
      python3 - <<'"'"'PY'"'"'
      import json
      import math
      import os

      raw = os.environ["RESPONSE"]
      pos_curly = raw.find("{")
      pos_bracket = raw.find("[")
      positions = [pos for pos in (pos_curly, pos_bracket) if pos != -1]
      if not positions:
          raise ValueError(f"no JSON object found in RESPONSE: {raw[:200]!r}")
      json_start = min(positions)
      try:
          payload, _ = json.JSONDecoder().raw_decode(raw[json_start:])
      except json.JSONDecodeError as exc:
          raise ValueError(
              f"failed to decode RESPONSE JSON from offset {json_start}: {raw[json_start:json_start + 200]!r}"
          ) from exc
      adoption = payload["coverage"]["adoption"]
      cpu_stats = payload["cpuStats"]
      memory_stats = payload["memoryStats"]

      assert adoption["total"] >= 1, adoption
      assert adoption["nonOptimizable"] >= 1, adoption
      assert math.isclose(cpu_stats["workloadRequested"], 0.6, rel_tol=0, abs_tol=1e-9) or cpu_stats["workloadRequested"] >= 0.6, cpu_stats
      assert math.isclose(cpu_stats["recommended"], 0.6, rel_tol=0, abs_tol=1e-9) or cpu_stats["recommended"] >= 0.6, cpu_stats
      assert math.isclose(memory_stats["workloadRequested"], 0.192, rel_tol=0, abs_tol=1e-9) or memory_stats["workloadRequested"] >= 0.192, memory_stats
      assert math.isclose(memory_stats["recommended"], 0.192, rel_tol=0, abs_tol=1e-9) or memory_stats["recommended"] >= 0.192, memory_stats
      print("Overview payload verified successfully")
      PY
      '
