---
apiVersion: v1
kind: Namespace
metadata:
  name: test-incomplete-stats
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incomplete-deployment
  namespace: test-incomplete-stats
  labels:
    app: incomplete
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incomplete
  template:
    metadata:
      labels:
        app: incomplete
    spec:
      containers:
      - name: incomplete
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "96M"
            cpu: "300m"
          limits:
            memory: "192M"
            cpu: "600m"
