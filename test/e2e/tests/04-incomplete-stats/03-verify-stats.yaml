---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - command: echo "=== VERIFYING /stats RESPONSE FOR INCOMPLETE WORKLOAD ==="
  - command: |
      sh -ceu '
      RESPONSE="$(kubectl run curl-stats-incomplete --rm -i --restart=Never --image=curlimages/curl:latest -n cruisekube-system -- \
        curl -s http://cruisekube-controller.cruisekube-system.svc.cluster.local:8080/api/v1/clusters/default/stats)"
      export RESPONSE
      python3 - <<'"'"'PY'"'"'
      import json
      import math
      import os

      payload = json.loads(os.environ["RESPONSE"])
      matches = [
          stat for stat in payload.get("stats", [])
          if stat.get("namespace") == "test-incomplete-stats"
          and stat.get("name") == "incomplete-deployment"
      ]
      assert len(matches) == 1, matches
      stat = matches[0]
      metadata = stat.get("metadata") or {}
      assert stat.get("replicas") == 2, stat
      assert metadata.get("excluded") is True, metadata
      assert metadata.get("incomplete") is True, metadata
      assert "INCOMPLETE_STATS" in (metadata.get("excluded_codes") or []), metadata

      resources = stat.get("original_container_resources") or []
      assert len(resources) == 1, resources
      resource = resources[0]
      assert math.isclose(resource.get("cpu_request"), 0.3, rel_tol=0, abs_tol=1e-9), resource
      assert math.isclose(resource.get("memory_request"), 96.0, rel_tol=0, abs_tol=1e-9), resource
      print("Stats payload verified successfully")
      PY
      '
