---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - command: echo "=== VERIFYING /stats RESPONSE FOR INCOMPLETE WORKLOAD ==="
  - command: |
      sh -ceu '
      RESPONSE="$(kubectl run curl-stats-incomplete --rm -i --restart=Never --image=docker.io/curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17 -n cruisekube-system -- \
        curl --fail -sS --max-time 10 \
        -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhZG1pbiJ9.vDoHcYrtLHYHn709ypM4gIVSsTJR8wtRvpuHbQGySBY" \
        http://cruisekube-controller.cruisekube-system.svc.cluster.local:8080/api/v1/clusters/default/stats)"
      export RESPONSE
      python3 - <<'"'"'PY'"'"'
      import json
      import math
      import os

      raw = os.environ["RESPONSE"]
      pos_curly = raw.find("{")
      pos_bracket = raw.find("[")
      positions = [pos for pos in (pos_curly, pos_bracket) if pos != -1]
      if not positions:
          raise ValueError(f"no JSON object found in RESPONSE: {raw[:200]!r}")
      json_start = min(positions)
      try:
          payload, _ = json.JSONDecoder().raw_decode(raw[json_start:])
      except json.JSONDecodeError as exc:
          raise ValueError(
              f"failed to decode RESPONSE JSON from offset {json_start}: {raw[json_start:json_start + 200]!r}"
          ) from exc
      matches = [
          stat for stat in payload.get("stats", [])
          if stat.get("namespace") == "test-incomplete-stats"
          and stat.get("name") == "incomplete-deployment"
      ]
      assert len(matches) == 1, matches
      stat = matches[0]
      metadata = stat.get("metadata") or {}
      assert stat.get("replicas") == 2, stat
      assert metadata.get("excluded") is True, metadata
      assert "INCOMPLETE_STATS" in (metadata.get("excluded_codes") or []), metadata

      resources = stat.get("original_container_resources") or []
      assert len(resources) == 1, resources
      resource = resources[0]
      assert math.isclose(resource.get("cpu_request"), 0.3, rel_tol=0, abs_tol=1e-9), resource
      assert math.isclose(resource.get("memory_request"), 96.0, rel_tol=0, abs_tol=1e-9), resource
      print("Stats payload verified successfully")
      PY
      '
