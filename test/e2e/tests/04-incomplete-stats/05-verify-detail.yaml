---
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - command: echo "=== VERIFYING /detail RESPONSE ==="
  - command: |
      sh -ceu '
      RESPONSE="$(kubectl run curl-detail-incomplete --rm -i --restart=Never --image=docker.io/curlimages/curl@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17 -n cruisekube-system -- \
        curl --fail -sS --max-time 10 \
        -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhZG1pbiJ9.vDoHcYrtLHYHn709ypM4gIVSsTJR8wtRvpuHbQGySBY" \
        http://cruisekube-controller.cruisekube-system.svc.cluster.local:8080/api/v1/clusters/default/workloads/test-incomplete-stats/incomplete-deployment/detail)"
      export RESPONSE
      python3 - <<'"'"'PY'"'"'
      import json
      import math
      import os

      raw = os.environ["RESPONSE"]
      pos_curly = raw.find("{")
      pos_bracket = raw.find("[")
      positions = [pos for pos in (pos_curly, pos_bracket) if pos != -1]
      if not positions:
          raise ValueError(f"no JSON object found in RESPONSE: {raw[:200]!r}")
      json_start = min(positions)
      try:
          payload, _ = json.JSONDecoder().raw_decode(raw[json_start:])
      except json.JSONDecodeError as exc:
          raise ValueError(
              f"failed to decode RESPONSE JSON from offset {json_start}: {raw[json_start:json_start + 200]!r}"
          ) from exc
      assert payload["namespace"] == "test-incomplete-stats", payload
      assert payload["workload"] == "incomplete-deployment", payload
      assert math.isclose(payload["current_cpu_request"], 0.3, rel_tol=0, abs_tol=1e-9), payload
      assert math.isclose(payload["current_mem_request"], 96.0, rel_tol=0, abs_tol=1e-9), payload
      assert math.isclose(payload["potential_cpu_savings"], 0.0, rel_tol=0, abs_tol=1e-9), payload
      assert math.isclose(payload["potential_mem_savings"], 0.0, rel_tol=0, abs_tol=1e-9), payload

      pods = payload.get("pods") or []
      assert len(pods) == 2, pods
      for pod in pods:
          containers = pod.get("containers") or []
          assert len(containers) == 1, pod
          container = containers[0]
          assert container["container_name"] == "incomplete", container
          assert math.isclose(container["cpu_request"], 0.3, rel_tol=0, abs_tol=1e-9), container
          assert math.isclose(container["cpu_rec_request"], 0.3, rel_tol=0, abs_tol=1e-9), container
          assert math.isclose(container["mem_request"], 96.0, rel_tol=0, abs_tol=1e-9), container
          assert math.isclose(container["mem_rec_request"], 96.0, rel_tol=0, abs_tol=1e-9), container
      print("Detail payload verified successfully")
      PY
      '
