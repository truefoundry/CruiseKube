<svg width="100%" viewBox="0 0 680 535" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Page background -->
<rect x="0" y="0" width="680" height="535" fill="#0D1117"/>

<!-- Prometheus -->
<g onclick="sendPrompt('How does Prometheus scrape CPU, memory, and PSI metrics for CruiseKube?')" style="cursor:pointer">
  <rect x="240" y="24" width="200" height="54" rx="8" fill="#1C2333" stroke="#F78166" stroke-width="1"/>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#F78166" x="340" y="46" text-anchor="middle" dominant-baseline="central">Prometheus</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#8B949E" x="340" y="64" text-anchor="middle" dominant-baseline="central">scrape target</text>
</g>

<!-- Arrow: Prometheus → CruiseKube -->
<line x1="340" y1="78" x2="340" y2="130" stroke="#00C7A8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#00C7A8" x="350" y="106" dominant-baseline="central">CPU · memory · PSI</text>

<!-- CruiseKube outer container — extra vertical padding so inner boxes don't touch border -->
<rect x="58" y="138" width="564" height="120" rx="12" fill="#161B27" stroke="#00C7A8" stroke-width="1.5" stroke-dasharray="6 3"/>

<!-- CruiseKube badge on top border -->
<rect x="252" y="129" width="176" height="22" rx="11" fill="#003D33" stroke="#00C7A8" stroke-width="1"/>
<text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#00C7A8" x="340" y="140" text-anchor="middle" dominant-baseline="central">CruiseKube</text>

<!-- Collect box (inside container) -->
<g onclick="sendPrompt('What does the CruiseKube Collect phase pull from Prometheus?')" style="cursor:pointer">
  <rect x="78" y="172" width="154" height="68" rx="8" fill="#0D2A22" stroke="#1D9E75" stroke-width="1"/>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#3FB950" x="155" y="198" text-anchor="middle" dominant-baseline="central">Collect</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#8B949E" x="155" y="218" text-anchor="middle" dominant-baseline="central">every 1 min</text>
</g>

<!-- Arrow: Collect → Analyze -->
<line x1="232" y1="206" x2="258" y2="206" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Analyze box (inside container) -->
<g onclick="sendPrompt('How does the CruiseKube Analyze phase compute resource recommendations?')" style="cursor:pointer">
  <rect x="263" y="172" width="154" height="68" rx="8" fill="#0D1F36" stroke="#388BFD" stroke-width="1"/>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#58A6FF" x="340" y="198" text-anchor="middle" dominant-baseline="central">Analyze</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#8B949E" x="340" y="218" text-anchor="middle" dominant-baseline="central">every 15 min</text>
</g>

<!-- Arrow: Analyze → Apply -->
<line x1="417" y1="206" x2="443" y2="206" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Apply box (inside container) -->
<g onclick="sendPrompt('How does CruiseKube Apply decide between a runtime patch vs a webhook injection?')" style="cursor:pointer">
  <rect x="448" y="172" width="154" height="68" rx="8" fill="#2A1A12" stroke="#F78166" stroke-width="1"/>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#F0883E" x="525" y="198" text-anchor="middle" dominant-baseline="central">Apply</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#8B949E" x="525" y="218" text-anchor="middle" dominant-baseline="central">every 5 min</text>
</g>

<!-- Arrow: bottom-left of container → Runtime patch, with label fully left of the line -->
<path d="M 158 260 L 158 316" fill="none" stroke="#3FB950" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#3FB950" x="62" y="290" text-anchor="start" dominant-baseline="central">runtime patch</text>

<!-- Arrow: bottom-right of container → Webhook, with label right of the line -->
<path d="M 522 260 L 522 316" fill="none" stroke="#F78166" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#F78166" x="534" y="290" text-anchor="start" dominant-baseline="central">admission webhook</text>

<!-- Runtime patch box -->
<g onclick="sendPrompt('How does CruiseKube hot-patch resource requests and limits on running pods?')" style="cursor:pointer">
  <rect x="60" y="318" width="196" height="56" rx="8" fill="#0D2A22" stroke="#1D9E75" stroke-width="1"/>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#3FB950" x="158" y="339" text-anchor="middle" dominant-baseline="central">Runtime patch</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#8B949E" x="158" y="357" text-anchor="middle" dominant-baseline="central">live pods · in-place resize</text>
</g>

<!-- Webhook box -->
<g onclick="sendPrompt('How does CruiseKube mutating webhook intercept pod admission?')" style="cursor:pointer">
  <rect x="424" y="318" width="196" height="56" rx="8" fill="#2A1A12" stroke="#F78166" stroke-width="1"/>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#F0883E" x="522" y="339" text-anchor="middle" dominant-baseline="central">Webhook</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#8B949E" x="522" y="357" text-anchor="middle" dominant-baseline="central">new pods · admission mutate</text>
</g>

<!-- Merge arrows → K8s API Server -->
<path d="M 158 374 L 158 414 L 285 414 L 285 428" fill="none" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 522 374 L 522 414 L 395 414 L 395 428" fill="none" stroke="#30363D" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Kubernetes API Server -->
<g onclick="sendPrompt('What validation and admission chain does Kubernetes API Server run when CruiseKube submits a resource patch versus an admission webhook response?')" style="cursor:pointer">
  <rect x="175" y="430" width="330" height="60" rx="8" fill="#1C2333" stroke="#388BFD" stroke-width="1"/>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#58A6FF" x="340" y="453" text-anchor="middle" dominant-baseline="central">Kubernetes API Server</text>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#8B949E" x="340" y="473" text-anchor="middle" dominant-baseline="central">admission · scheduling · etcd</text>
</g>
</svg>
